<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>{{ hazard.page_title }}</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.26/"></script>
    <script>
        const hazardConfig = {
            key: "{{ hazard.key }}",
            pageTitle: "{{ hazard.page_title }}",
            displayName: "{{ hazard.display_name }}",
            runTitle: "{{ hazard.run_title }}",
            forecastTitle: "{{ hazard.forecast_title }}",
            legendAlt: "{{ hazard.legend_alt }}",
            displayStateUrl: "{{ hazard.display_state_url }}",
            statusUrl: "{{ hazard.status_url }}",
            runUrl: "{{ hazard.run_url }}",
            dataDir: "{{ hazard.data_dir }}",
            riskRgbPrefix: "{{ hazard.risk_rgb_prefix }}",
            defaultZoom: {{ hazard.zoom }},
            allOpacity: {{ hazard.all_opacity }},
            singleOpacity: {{ hazard.single_opacity }}
        };
        const hazardCurrentRegions = {{ hazard_current_regions_json|safe }};
        const hazardForecastRegions = {{ hazard_forecast_regions_json|safe }};
        const hazardForeignCurrentRegions = {{ hazard_foreign_current_regions_json|default:"[]"|safe }};
        const hazardForeignForecastRegions = {{ hazard_foreign_forecast_regions_json|default:"[]"|safe }};
        const typhoonApiConfig = {
            listUrl: "{% url 'typhoon_list_api' %}",
            historyUrl: "{% url 'typhoon_history_track_api' %}",
            liveUrl: "{% url 'typhoon_live_track_api' %}",
            impactedPrefectureUrl: "{% url 'typhoon_impacted_prefecture_api' %}"
        };
        const hazardWeatherApiMeta = {{ hazard_weather_api_meta_json|safe }};
        const clearLatestPointApiUrl = "{% url 'clear_latest_point' %}";
        const latestPointApiUrl = "{% url 'latest_point' %}";
        const staticPrefixUrl = "{% get_static_prefix %}";
    </script>

    <style>
        * {
            margin-left: 0;
            margin-right: 0;
            padding: 0;
        }

        .esri-ui-corner .esri-component {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0);
        }

        .esri-attribution {
            display: none !important;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        ul {
            list-style: none;
        }

        .nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            padding: 0;
            margin: 0;
        }

        .nav > li {
            position: relative;
            overflow: visible;
            float: none;
            width: auto;
        }

    </style>

    <style>
        #Choose {
            position: fixed;
            top: 14px;
            right: 14px;
            left: auto;
            bottom: auto;
            z-index: 99999;
            width: auto;
            max-width: calc(100vw - 16px);
        }

        .drawer {
            position: relative;
        }

        .hazard-split {
            position: relative;
            display: flex;
            justify-content: flex-end;
        }

        .hazard-main-btn,
        .tomorrow-toggle-btn,
        .hazard-forecast-btn {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0, 0, 0, 0);
            border-radius: 14px;
            text-align: center;
            box-sizing: border-box;
            color: black;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            font-size: 11px;
            line-height: 1.2;
            cursor: pointer;
            text-decoration: none;
        }

        .hazard-main-btn:hover,
        .tomorrow-toggle-btn:hover,
        .hazard-forecast-btn:hover,
        .hazard-main-btn.is-active,
        .tomorrow-toggle-btn.is-open {
            background-color: rgba(100, 149, 237, 0.45);
            border-color: rgba(0, 0, 0, 0);
            color: white;
        }

        .hazard-main-btn,
        .tomorrow-toggle-btn {
            min-width: 78px;
            width: 78px;
            padding: 8px 8px;
            white-space: nowrap;
        }

        .rain-radar-btn {
            min-width: 78px;
            width: 78px;
            padding: 8px 8px;
            white-space: nowrap;
            background-color: rgba(100, 149, 237, 0.45);
            border: 1px solid rgba(0, 0, 0, 0.65);
            border-radius: 14px;
            text-align: center;
            box-sizing: border-box;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            font-size: 11px;
            line-height: 1.2;
            cursor: pointer;
            text-decoration: none;
        }

        .rain-radar-btn:hover,
        .rain-radar-btn.is-active {
            background-color: rgba(100, 149, 237, 0.85);
            border-color: rgba(0, 0, 0, 0.85);
            color: white;
        }

        .typhoon-toggle-btn {
            min-width: 78px;
            width: 78px;
            padding: 8px 8px;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(0, 0, 0, 0);
            border-radius: 14px;
            text-align: center;
            box-sizing: border-box;
            color: black;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            font-size: 11px;
            line-height: 1.2;
            cursor: pointer;
            text-decoration: none;
        }

        .typhoon-toggle-btn:hover,
        .typhoon-toggle-btn.is-active {
            background-color: rgba(100, 149, 255, 0.45);
            border-color: rgba(0, 0, 0, 0);
            color: black;
        }

        .hazard-forecast-menu {
            position: absolute;
            top: 0;
            right: 106px;
            display: none;
            z-index: 10001;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 10px 24px rgba(136, 136, 136, 0.9);
        }

        .hazard-split.open .hazard-forecast-menu {
            display: block;
        }

        .hazard-forecast-btn {
            min-width: 78px;
            width: 100%;
            padding: 8px 8px;
            white-space: nowrap;
        }

        #typhoonPanel {
            position: fixed;
            top: 14px;
            right: 102px;
            z-index: 99998;
            width: min(276px, calc(100vw - 126px));
            max-height: calc(100vh - 28px);
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            border-radius: 18px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.45);
            color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 14px 28px  rgba(136, 136, 136, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #typhoonPanel.is-open {
            display: flex;
        }

        .typhoon-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .typhoon-panel-title {
            font:  14px/1.2 "Microsoft YaHei", Arial, sans-serif;
        }

        .typhoon-panel-close {
            border: 0;
            background: transparent;
            color: #000000;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }

        .typhoon-search-input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #000000;
            padding: 7px 9px;
            box-sizing: border-box;
            outline: none;
            font: 12px/1.4 "Microsoft YaHei", Arial, sans-serif;
        }

        .typhoon-search-input::placeholder {
            color: rgba(0, 0, 0, 0.72);
        }

        .typhoon-panel-tip,
        .typhoon-loading-text,
        .typhoon-empty-text {
            font: 12px/1.5 "Microsoft YaHei", Arial, sans-serif;
            color: rgba(0, 0, 0, 0.86);
        }

        .typhoon-panel-tip {
            display: none;
        }

        .typhoon-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 268px;
            overflow: auto;
            padding-right: 2px;
        }

        .typhoon-list::-webkit-scrollbar {
            width: 6px;
        }

        .typhoon-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 999px;
        }

        .typhoon-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            color: #000000;
            padding: 8px 10px;
            box-sizing: border-box;
            cursor: pointer;
            text-align: left;
        }

        .typhoon-item:hover,
        .typhoon-item.is-selected {
            background: rgba(100, 149, 237, 0.42);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .typhoon-item-main {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .typhoon-item-name {
            font:  12px/1.2 "Microsoft YaHei", Arial, sans-serif;
            color: #000000;
        }

        .typhoon-item-meta {
            font: 10px/1.25 Consolas, "Microsoft YaHei", monospace;
            color: rgba(0, 0, 0, 0.8);
            word-break: break-all;
        }

        .typhoon-item-badges {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            flex: 0 0 auto;
        }

        .typhoon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            padding: 3px 7px;
            border-radius: 999px;
            font: 700 10px/1 "Microsoft YaHei", Arial, sans-serif;
            background: rgba(255, 255, 255, 0.18);
            color: #000000;
        }

        .typhoon-badge.is-active {
            background: rgba(37, 211, 102, 0.24);
            color: #d8ffe5;
        }

        .typhoon-info-card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 12px;
            display: none;
        }

        .typhoon-info-title {
            font: 700 12px/1.2 "Microsoft YaHei", Arial, sans-serif;
            margin-bottom: 8px;
        }

        .typhoon-info-grid {
            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 6px 8px;
            font: 12px/1.4 "Microsoft YaHei", Arial, sans-serif;
        }

        .typhoon-info-label {
            color: rgba(255, 255, 255, 0.72);
        }

        .typhoon-info-value {
            color: #fff;
            word-break: break-all;
        }
    </style>

    <style>
        html,
        body,
        #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }

        #add {
            margin-bottom: 5px;
        }

        #actions {
            padding: 5px;
        }

        .add-button {
            background-color: #af5b4c;
            border-radius: 14px;
            border: 2px solid #000000;
            color: white;
            padding: 8px 12px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-right: 0px;
            cursor: pointer;
            transition-duration: 0.4s
        }

        .add-button4 {
            background-color: #af5b4c;
            border-radius: 12px;
            border: 2px solid #000000;
            color: white;
            padding: 4px 4px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin-right: 0px;
            cursor: pointer;
            transition-duration: 0.4s
        }

        .add-button2:hover {
            box-shadow: 0 0px 0px 0px rgba(0,0,0,0.24), 0 0px 0px 0 rgba(0,0,0,0.19);
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .button-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
        }

        .button-container button {
            margin-bottom: 5px;
        }

        #legendDrawer{
            position: absolute;
            right: 12px;
            bottom: 16px;
            z-index: 99999;
            display: block;
        }

        #adviceEntry{
            position: absolute;
            right: 84px;
            bottom: 16px;
            z-index: 99999;
            display: block;
        }
        #basemapEntry{
            position: absolute;
            right: 180px;
            bottom: 16px;
            z-index: 99999;
            display: block;
        }

        #hazardTimestamp{
            position: absolute;
            left: 14px;
            bottom: 16px;
            z-index: 99999;
            display: none;
            max-width: min(52vw, 420px);
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.3);
            color: #000000;
            font: 12px/1.45 "Microsoft YaHei", Arial, sans-serif;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .advice-entry-btn{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0);
            background: rgba(255, 255, 255, 0.3);
            color: #000000;
            border-radius: 999px;
            padding: 8px 14px;
            font: 400 13px/1 "Microsoft YaHei", Arial, sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
            text-decoration: none;
            white-space: nowrap;
        }
        .advice-entry-btn:hover,
        .legend-toggle-btn:hover
         {
            background-color: rgba(100, 149, 237, 0.45);
            border-color: rgba(0, 0, 0, 0);
            color: white;
        }


        .legend-toggle-btn{
            border: 1px solid rgba(0, 0, 0, 0);
            background: rgba(255, 255, 255, 0.3);
            color: #000000;
            border-radius: 999px;
            padding: 8px 14px;
            font: 400 13px/1 "Microsoft YaHei", Arial, sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
        }

        #mytuli{
            position: absolute;
            right: 0px;
            bottom: 46px;
            z-index: 99999;
            display: none;
            padding: 2px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
        }


        #mytuli img{
            display:block;
            max-width: 80px;
            max--height:80px;
            border-radius: 12px;
        }

        #mytuli.is-open{
            display: block;
        }

        #runStatusPanel{
            position: absolute;
            right: 10px;
            top: 56px;
            z-index: 999999;
            width: min(420px, calc(100vw - 20px));
            max-height: 40vh;
            overflow: auto;
            background: rgba(7, 20, 38, 0.78);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 5px 5px;
            box-sizing: border-box;
            font: 12px/1.45 Consolas, "Microsoft YaHei", monospace;
            display: none;
            white-space: pre-wrap;
        }

        #runStatusPanel.is-hidden{
            display: none !important;
        }

        .run-status-header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font: 600 13px/1.2 "Microsoft YaHei", Arial, sans-serif;
        }

        .run-status-left{
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .run-status-toggle{
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        #runStatusPanel.is-collapsed .run-status-close{
            padding: 0;
            margin: 0;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            line-height: 1;
            flex: 0 0 16px;
        }
        .run-status-title{
            white-space: nowrap;
            line-height: 1.05;
        }

        .run-status-summary{
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.9;
            max-width: 180px;
            font: 12px/1.2 Consolas, "Microsoft YaHei", monospace;
            line-height: 1.05;
            border-radius: 999px;
        }

        .run-status-close{
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .run-status-body{
            font: 12px/1.6 Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        #runStatusPanel.is-collapsed{
            width: auto;
            max-width: min(260px, calc(100vw - 20px));
            height: auto;
            max-height: none;
            overflow: visible;
            padding: 0;
            min-height: 0;
            display: inline-flex;
            align-items: center;
            box-sizing: border-box;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        #runStatusPanel.is-collapsed .run-status-body{
            display: none;
        }

        #runStatusPanel.is-collapsed .run-status-header{
            min-height: 0;
            margin: 0;
            gap: 4px;
            width: auto;
            height: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font: 600 12px/1 "Microsoft YaHei", Arial, sans-serif;
        }

        #runStatusPanel.is-collapsed .run-status-left{
            gap: 4px;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            flex: 1 1 auto;
        }

        #runStatusPanel.is-collapsed .run-status-title{
            display: none;
        }

        #runStatusPanel.is-collapsed .run-status-title,
        #runStatusPanel.is-collapsed .run-status-summary{
            font: 12px/1.2 Consolas, "Microsoft YaHei", monospace;
            line-height: 1.2;
        }

        #runStatusPanel.is-collapsed .run-status-summary{
            max-width: none;
            display: inline-block;
            white-space: nowrap;
            vertical-align: middle;
        }

        #runStatusPanel.is-collapsed .run-status-toggle{
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            min-height: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
            flex: 0 0 12px;
            padding: 0;
            margin: 0;
            vertical-align: middle;
        }

        #runStatusPanel.is-collapsed .run-status-close{
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            min-height: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
            flex: 0 0 14px;
            padding: 0;
            margin: 0;
            vertical-align: middle;
        }

          #Choose{
              top: 10px;
              right: 8px;
              left: auto;
              max-width: calc(100vw - 12px);
          }

              gap: 6px;
          }

          .tomorrow-toggle-btn,
          .rain-radar-btn,
          .typhoon-toggle-btn{

              padding: 8px 7px;
              font-size: 12px;
          }

              top: 10px;
              right: 92px;
              width: min(226px, calc(100vw - 102px));
              max-height: calc(100vh - 20px);
              padding: 9px;
              gap: 6px;
          }

          .hazard-forecast-menu{
              right: 96px;
              padding: 6px;
          }

          .hazard-forecast-btn{
              min-width: 72px;
              padding: 8px 7px;
              font-size: 12px;
          }

          #legendDrawer{
              right: 8px;
              bottom: 12px;
          }

            #adviceEntry{
                right: 76px;
                bottom: 12px;
            }
            #basemapEntry{
                right: 144px;
                bottom:12px;
            }

            #hazardTimestamp{
                left: 8px;
                bottom: 12px;
                max-width: min(62vw, 360px);
                padding: 7px 10px;
                font-size: 11px;
            }

          .legend-toggle-btn{
              padding: 8px 12px;
              font-size: 12px;
          }

          .advice-entry-btn{
              padding: 8px 12px;
              font-size: 12px;
          }

          #mytuli{
              right: 0;
              bottom: 42px;
          }

          #runStatusPanel{
              top: 60px;
              right: 8px;
              width: min(360px, calc(100vw - 16px));
          }

          #mytuli img{
              max-width: 14vw;
              min-width: 40px;
              height: auto;
          }
        }

        @media (max-width: 366px){
          #Choose{
              top: 8px;
              right: 6px;
              left: auto;
              max-width: calc(100vw - 10px);
          }

          .hazard-main-btn,
          .tomorrow-toggle-btn,
          .rain-radar-btn,
          .typhoon-toggle-btn{
              min-width: 68px;
              width: 68px;
              padding: 7px 6px;
              font-size: 11px;
          }

          #typhoonPanel{
              top: 8px;
              right: 86px;
              width: min(214px, calc(100vw - 94px));
              padding: 8px;
              gap: 5px;
          }

          .hazard-forecast-menu{
              right: 88px;
          }

          .hazard-forecast-btn{
              min-width: 68px;
              padding: 7px 6px;
              font-size: 11px;
          }

          #legendDrawer{
              right: 6px;
              bottom: 10px;
          }

            #adviceEntry{
                right: 72px;
                bottom: 10px;
            }
            #basemapEntry{
                right:148px;
                bottom:10px;
            }

            #hazardTimestamp{
                left: 6px;
                bottom: 10px;
                max-width: min(70vw, 300px);
                padding: 6px 9px;
                font-size: 11px;
            }

          .legend-toggle-btn{
              padding: 7px 11px;
              font-size: 12px;

            function renderClipLayerFromUrl(clipUrl, extentText, markerInfo) {
                if (!clipUrl || !__viewRef || !__viewRef.map) {
                    return;
                }

                console.log("🔥 [底层诊断] 收到 URL，准备请求 ArcGIS:", clipUrl);

                if (typeof clearRiskLayers === "function") clearRiskLayers();
                if (window.__clipLayer) {
                    try {
                        __viewRef.map.remove(window.__clipLayer);
                    } catch (e) {}
                    window.__clipLayer = null;
                }

                const fullUrl = encodeStaticUrlFromPath(clipUrl);
                window.__clipLayer = createImageryRasterLayer(fullUrl, 0.85);
                window.__clipLayer.load().then(function() {
                    console.log("✅ [底层诊断] TIF 解析成功！图层范围 Extent:", window.__clipLayer.fullExtent);
                    __viewRef.map.add(window.__clipLayer);

                    const finalizeMarker = function() {
                        if (markerInfo && Number.isFinite(Number(markerInfo.lon)) && Number.isFinite(Number(markerInfo.lat))) {
                            addMarker(Number(markerInfo.lon), Number(markerInfo.lat), markerInfo.label || "目标点", markerInfo.riskLevel || "");
                        }
                        if (typeof keepAnnotationLayerOnTop === "function") keepAnnotationLayerOnTop();
                    };

                    if (extentText) {
                        try {
                            const parsedExtent = typeof extentText === "string"
                                ? JSON.parse(extentText.replace(/'/g, '"'))
                                : extentText;
                            if (parsedExtent) {
                                __viewRef.goTo(parsedExtent, { duration: 1000 })
                                    .catch(function(){})
                                    .finally(finalizeMarker);
                                return;
                            }
                        } catch (e) {
                            console.warn("parse clip extent failed:", extentText, e);
                        }
                    }
                    const fullExtent = window.__clipLayer.fullExtent;
                    if (fullExtent) {

            function applySetPointPayload(payload) {
                const p = payload || {};
                const lon = Number(p.longitude);
                const lat = Number(p.latitude);
                if(!Number.isFinite(lon) || !Number.isFinite(lat)) return false;

                if(!__viewRef || !__viewRef.map) {
                    __pendingSetPointPayload = p;
                    console.log("⏳ 视图尚未就绪，已缓存 SET_POINT 载荷");
                    return false;
                }

                __pendingSetPointPayload = null;

                if(p.legend === true) showLegend(); else hideLegend();

                const label = p.place || "目标点";
                const riskLevel = p.risk_level || "";

                clearMarker();

                if (p.clip_url) {
                    __lastClipCoords = { lon: lon, lat: lat };
                } else {
                    if (__lastClipCoords &&
                        Math.abs(__lastClipCoords.lon - lon) < 0.0001 &&
                        Math.abs(__lastClipCoords.lat - lat) < 0.0001) {
                        console.log("🛡️ 成功拦截到后台轮询产生的重复点位，屏蔽大头针！");
                    } else {
                        __lastClipCoords = null;
                        addMarker(lon, lat, label, riskLevel);
                    }
                }

                const risk = riskLevel ? (" · " + riskLevel) : "";
                _toast("已定位：" + label + risk);

                if (p.clip_url) {
                    renderClipLayerFromUrl(p.clip_url, p.extent, {
                        lon: lon,
                        lat: lat,
                        label: label,
                        riskLevel: riskLevel
                    });
                }
                return true;

                    if (!Number.isFinite(Number(payload.longitude)) || !Number.isFinite(Number(payload.latitude))) return;
                    const payloadId = payload.id || null;
                    const payloadTs = payload.ts || null;
                    if (payloadId && payloadId === __latestPointSyncId && payloadTs && payloadTs === __latestPointSyncTs) {
                        return;
                    }
                    __latestPointSyncId = payloadId;
                    __latestPointSyncTs = payloadTs;
                    applySetPointPayload(payload);
                } catch (e) {
                    console.warn("restoreLatestPointState failed:", e);

                if (Number.isFinite(speed)) {
                    if (speed >= 51) return 160;
                    if (speed >= 33) return 130;
                    if (speed >= 25) return 110;
                    if (speed >= 17) return 90;
                    if (speed >= 10) return 70;
                    if (speed > 0) return 55;
                }

                const level = String(point?.type || "");
                if (level.includes("\u8d85\u5f3a")) return 160;
                if (level.includes("\u5f3a\u53f0\u98ce")) return 130;
                if (level.includes("\u53f0\u98ce")) return 110;
                if (level.includes("\u5f3a\u70ed\u5e26\u98ce\u66b4")) return 90;
                if (level.includes("\u70ed\u5e26\u98ce\u66b4")) return 70;
                if (level.includes("\u70ed\u5e26\u4f4e\u538b")) return 55;
                return 60;
            }

            function calcPointMaxWindRadiusKm(point) {
                const levels = ["windRadius30", "windRadius50", "windRadius64"];
                const directions = ["neRadius", "seRadius", "swRadius", "nwRadius"];
                const values = [];
                levels.forEach((key) => {
                    const block = point?.[key];
                    if (!block || typeof block !== "object") return;
                    directions.forEach((dir) => {
                        const value = Number(block?.[dir]);
                        if (Number.isFinite(value) && value > 0) values.push(value);
                    });
                });
                if (values.length) {
                    return { km: Math.max(...values), inferred: false };
                }
                return { km: calcPointFallbackRadiusKm(point), inferred: true };
            }
            function formatPointMaxWindRadius(point) {
                const result = calcPointMaxWindRadiusKm(point);
                const kmText = `${Math.round(result.km)} km`;
                return result.inferred ? `${kmText} (estimated)` : kmText;
            }
            function makeTyphoonPointGraphic(point, color, outlineColor) {
                return new Graphic({
                    geometry: {
                        type: "point",
                        longitude: point.lon,
                        latitude: point.lat
                    },
                    elevationInfo: {
                        mode: "relative-to-ground",
                        offset: 1500
                    },
                    symbol: {
                        type: "simple-marker",
                        style: "circle",
                        size: 7,
                        color: color,
                        outline: {
                            color: outlineColor,
                            width: 1.4
                        }
                    },
                    attributes: {
                        timeText: point.time || "N/A",
                        levelText: point.type || "N/A",
                        windSpeedText: point.windSpeed || "N/A",
                        pressureText: point.pressure || "N/A",
                        moveDirText: point.moveDir || "N/A",
                        moveSpeedText: point.moveSpeed || "N/A",
                        maxRadiusText: formatPointMaxWindRadius(point)
                    },
                    popupTemplate: {

                        content: `
                            <div>时间：{timeText}</div>

                            <div>气压：{pressureText}</div>
                            <div>移动方向：{moveDirText}</div>
                            <div>移动速度：{moveSpeedText}</div>
                            <div>该台风点最大风圈半径为：{maxRadiusText}</div>
                        `
                    }
                });
            }

            function radiusKmToDegreeOffsets(radiusKm, latitude) {
                const latRadians = (latitude || 0) * Math.PI / 180;
                const latOffset = (radiusKm || 0) / 111;
                const cosLat = Math.max(Math.cos(latRadians), 0.2);
                const lonOffset = (radiusKm || 0) / (111 * cosLat);
                return { lonOffset, latOffset };
            }

            function buildWindRadiusRing(point, radiusBlock) {
                if (!radiusBlock) return [];
                const samples = [
                    { angle: 0, radius: radiusBlock.neRadius },
                    { angle: 45, radius: radiusBlock.neRadius },
                    { angle: 90, radius: radiusBlock.neRadius },
                    { angle: 135, radius: radiusBlock.nwRadius },
                    { angle: 180, radius: radiusBlock.nwRadius },
                    { angle: 225, radius: radiusBlock.swRadius },
                    { angle: 270, radius: radiusBlock.swRadius },
                    { angle: 315, radius: radiusBlock.seRadius },
                ];

                const ring = [];
                samples.forEach((sample) => {
                    if (!(sample.radius > 0)) return;
                    const radians = sample.angle * Math.PI / 180;
                    const offsets = radiusKmToDegreeOffsets(sample.radius, point.lat);
                    ring.push([
                        point.lon + offsets.lonOffset * Math.cos(radians),
                        point.lat + offsets.latOffset * Math.sin(radians)
                    ]);
                });
                if (ring.length >= 3) {
                    ring.push(ring[0]);
                }
                return ring;
            }

            function makeTyphoonRadiusGraphic(point, radiusBlock, levelLabel, color) {
                const ring = buildWindRadiusRing(point, radiusBlock);
                if (ring.length < 4) return null;
                return new Graphic({
                    geometry: {
                        type: "polygon",
                        rings: [ring]
                    },
                    symbol: {
                        type: "simple-fill",
                        color: [0, 0, 0, 0],
                        outline: {
                            color: color,
                            width: 2.2,
                            style: "dash"
                        }
                    },
                    attributes: {
                        时间: point.time || "暂无",
                        风圈等级: levelLabel,
                        东北半径: radiusBlock.neRadius ?? "暂无",
                        东南半径: radiusBlock.seRadius ?? "暂无",
                        西南半径: radiusBlock.swRadius ?? "暂无",
                        西北半径: radiusBlock.nwRadius ?? "暂无"
                    },
                    popupTemplate: {
                        title: `${levelLabel}风圈`,
                        content: `
                            <div>时间：{时间}</div>
                            <div>东北半径：{东北半径} km</div>

                            <div>西北半径：{西北半径} km</div>
                        `
                    }
                });
            }
            function getTyphoonImpactStyleByZoom() {
                const zoom = Number(__viewRef?.zoom ?? 6);
                const lineWidth = zoom >= 11 ? 1.8 : zoom >= 9 ? 1.6 : zoom >= 7 ? 1.4 : 1.2;
                return {

            function buildTyphoonImpactPolygonSymbol(style) {

            }

            function buildTyphoonImpactLayerRenderer() {
                const style = getTyphoonImpactStyleByZoom();
                const isSceneView = (__viewRef && __viewRef.type === "3d");
                if (isSceneView) {
                    return {

            function applyTyphoonImpactStyle() {
                if (!Array.isArray(__typhoonImpactGraphics) || !__typhoonImpactGraphics.length) return;
                const style = getTyphoonImpactStyleByZoom();
                __typhoonImpactGraphics.forEach((graphic) => {

            function makeImpactedPrefectureGraphic(geometry, properties) {
                if (!geometry || !geometry.type) return [];
                const cityName = properties?.city || properties?.name || "Impacted City";
                const provinceName = properties?.province || "";
                const style = getTyphoonImpactStyleByZoom();
                const buildFillGraphic = (rings) => new Graphic({
                    geometry: {
                        type: "polygon",
                        rings: rings
                    },
                    symbol: {
                        type: "simple-fill",
                        color: style.fillColor,

                const graphics = [];
                if (geometry.type === "Polygon") {
                    const rings = (geometry.coordinates || []).filter((ring) => Array.isArray(ring) && ring.length >= 4);
                    if (rings.length) graphics.push(buildFillGraphic(rings));
                    return graphics;
                }

                if (geometry.type === "MultiPolygon") {
                    (geometry.coordinates || []).forEach((polygon) => {
                        const rings = (polygon || []).filter((ring) => Array.isArray(ring) && ring.length >= 4);
                        if (rings.length) graphics.push(buildFillGraphic(rings));

            function drawImpactedPrefectures(payload) {
                clearTyphoonImpactGraphics();
                if (!payload || !__viewRef) {

                const shouldLoadImpactTif = !!(payload?.impacted_union_tif_url || Number(payload?.count || 0) > 0);

            async function loadAndDrawImpactedPrefectures(trackData) {

            async function drawTyphoonTrack(trackData, mode) {
                if (!__viewRef) {
                    buildView([], true, false);
                }
                clearTyphoonGraphics();
                if (!trackData || !trackData.points || !trackData.points.length) {
                    throw new Error("No typhoon track points available");
                }

                const isLive = mode === "live";
                const lineColor = isLive ? [168, 0, 84, 0.98] : [0, 102, 204, 0.98];
                const pointColor = isLive ? [214, 51, 132, 0.98] : [0, 141, 255, 0.98];
                const pointOutline = isLive ? [255, 245, 250, 1] : [245, 250, 255, 1];
                const ring30Color = [0, 170, 160, 0.96];
                const ring50Color = [123, 44, 191, 0.96];
                const ring64Color = [214, 51, 132, 0.98];
                const graphics = [];

                if (trackData.line && trackData.line.length >= 2) {
                    graphics.push(new Graphic({
                        geometry: {
                            type: "polyline",
                            paths: [trackData.line]
                        },
                        elevationInfo: {
                            mode: "relative-to-ground",
                            offset: 1500
                        },
                        symbol: {
                            type: "simple-line",
                            color: lineColor,
                            width: isLive ? 3 : 2.5,
                            style: isLive ? "dash" : "solid"
                        },
                        attributes: {
                            stormId: trackData.stormid || "",
                            updateTime: trackData.updateTime || "",
                            dataType: isLive ? "Live Track" : "History Track"
                        },
                        popupTemplate: {
                            title: selectedTyphoonMeta ? (selectedTyphoonMeta.name || selectedTyphoonMeta.id) : "Typhoon Track",
                            content: `
                                <div>ID: {stormId}</div>
                                <div>Type: {dataType}</div>
                                <div>Update: {updateTime}</div>
                            `
                        }
                    }));
                }


                trackData.points.forEach((point) => {
                    graphics.push(makeTyphoonPointGraphic(point, pointColor, pointOutline));
                });

                __viewRef.graphics.addMany(graphics);
                __typhoonGraphics = graphics;
                typhoonVisibleMode = mode;
                updateTyphoonButtons();

                const impactedCount = await loadAndDrawImpactedPrefectures(trackData);
                // Ensure track points/line stay visually on top of impacted-area fill.
                try {
                    if (Array.isArray(__typhoonGraphics) && __typhoonGraphics.length) {
                        __viewRef.graphics.removeMany(__typhoonGraphics);
                        __viewRef.graphics.addMany(__typhoonGraphics);
                    }
                } catch (e) {}

                const coords = trackData.points.map((point) => [point.lon, point.lat]);
                if (coords.length) {
                    __viewRef.goTo(coords, { duration: 800 }).catch(() => {});
                }

                const typeText = isLive ? "实时路径" : "历史路径";
                _toast(`已加载${selectedTyphoonMeta ? (selectedTyphoonMeta.name || selectedTyphoonMeta.id) : "台风"}${typeText}`);
            }

            function keepAnnotationLayerOnTop() {

            async function syncDisplayState(modeOverride) {
                const regionForQuery = normalizeRegionAlias(selectedRegion || "所有");
                const modeForQuery = modeOverride || currentDisplayMode || "current";
                try {
                    await fetch(hazardConfig.displayStateUrl, {

            function normalizeRegionAlias(regionName) {
                const normalized = String(regionName || "").trim() || "所有";
                const regionAliasMap = {
                    "中国": "所有",
                    "全国": "所有",
                    "广东": "粤港澳",
                    "香港": "粤港澳",
                    "澳门": "粤港澳"
                };
                return regionAliasMap[normalized] || normalized;
            }

            function isChinaOnlyNationalHazardRegion(regionName) {
                if (!["landslide", "flood", "wind"].includes(hazardConfig.key)) {
                    return false;
                }
                const normalized = String(regionName || "").trim() || "所有";
                return normalized === "所有" || normalized === "中国" || normalized === "全国";
            }

            function shouldAppendForeignCurrentLandslide(regionName, displayMode) {
                if (hazardConfig.key !== "landslide" || displayMode !== "current") {
                    return false;
                }
                const normalized = String(regionName || "").trim() || "所有";
                return normalized === "所有" || normalized === "中国" || normalized === "全国";
            }

            function buildStaticDataUrl(parts) {
                const encodedParts = [resolveStaticRootPath().replace(/\/$/, ""), "数据"].concat(parts).map((part, index) => {
                    if (index === 0) {
                        return part;
                    }
                    return encodeURIComponent(String(part || "").trim());
                });
                return new URL(encodedParts.join("/"), window.location.origin).href;
            }

            function getAppBasePath() {
                const apiCandidates = [
                    clearLatestPointApiUrl,
                    latestPointApiUrl,
                    hazardConfig.displayStateUrl
                ].map((value) => String(value || "").trim()).filter(Boolean);

                for (const apiPath of apiCandidates) {
                    const idx = apiPath.indexOf("/api/");
                    if (idx >= 0) {
                        return apiPath.slice(0, idx);
                    }
                }
                return "";
            }

            function resolveStaticRootPath() {
                const rawStaticPrefix = String(staticPrefixUrl || "").trim() || "/static/";
                if (/^https?:\/\//i.test(rawStaticPrefix)) {
                    return new URL(rawStaticPrefix).pathname.replace(/\/$/, "");
                }
                const normalizedStaticPrefix = rawStaticPrefix.startsWith("/") ? rawStaticPrefix : `/${rawStaticPrefix}`;
                const appBasePath = getAppBasePath();
                if (appBasePath && !normalizedStaticPrefix.startsWith(`${appBasePath}/`)) {
                    return `${appBasePath}${normalizedStaticPrefix}`.replace(/\/+$/, "");
                }
                return normalizedStaticPrefix.replace(/\/+$/, "");
            }

            function encodeStaticUrlFromPath(pathValue) {
                const rawPath = String(pathValue || "").trim();
                if (!rawPath) return "";
                let normalizedPath = rawPath;
                const staticRootPath = resolveStaticRootPath();
                if (rawPath.startsWith("/static/") && !rawPath.startsWith(`${staticRootPath}/`)) {
                    normalizedPath = `${staticRootPath}${rawPath.slice("/static".length)}`;
                }
                const parsed = new URL(normalizedPath, window.location.origin);
                const encodedPathname = parsed.pathname
                    .split("/")
                    .map((segment, index) => {
                        if (index === 0 || !segment) return segment;
                        return encodeURIComponent(segment);
                    })
                    .join("/");
                return `${parsed.origin}${encodedPathname}${parsed.search || ""}${parsed.hash || ""}`;
            }

            function createImageryRasterLayer(url, opacity) {
                const layer = new ImageryTileLayer({
                    url: url,
                    opacity: opacity
                });
                layer.load().catch((error) => {
                    console.error("risk imagery layer load failed:", url, error);
                    _toast("风险图层加载失败");
                });
                return layer;
            }

            function getRegionsForMode(displayMode) {
                const modeRegions = displayMode === "forecast" ? hazardForecastRegions : hazardCurrentRegions;
                if (Array.isArray(modeRegions) && modeRegions.length) {
                    return modeRegions.slice();
                }
                return REGIONS.filter(r => r !== "所有");
            }

            function resolveRequestedRegions(regionName, displayMode = "current") {
                const requestedRegions = regionName === "所有" ? getRegionsForMode(displayMode) : [regionName];
                const resolvedRegions = requestedRegions.map(normalizeRegionAlias);
                return Array.from(new Set(resolvedRegions));
            }

            function buildRiskLayersForRegion(regionName, displayMode) {
                const suffix = displayMode === "forecast" ? "明日" : "当前";
                if (isChinaOnlyNationalHazardRegion(regionName)) {
                    const layers = [createImageryRasterLayer(
                        buildStaticDataUrl([hazardConfig.dataDir, "中国", `${hazardConfig.riskRgbPrefix}_${suffix}.tif`]),
                        hazardConfig.singleOpacity
                    )];
                    if (shouldAppendForeignCurrentLandslide(regionName, displayMode)) {
                        layers.push(createImageryRasterLayer(
                            buildStaticDataUrl(["国外滑坡", "滑坡风险图_RGB_当前.tif"]),
                            hazardConfig.singleOpacity
                        ));
                    }
                    return layers;
                }
                const regions = resolveRequestedRegions(regionName, displayMode);
                return regions.map((region) => createImageryRasterLayer(
                    buildStaticDataUrl([hazardConfig.dataDir, region, `${hazardConfig.riskRgbPrefix}_${suffix}.tif`]),
                    regionName === "所有" ? hazardConfig.allOpacity : hazardConfig.singleOpacity
                ));
            }

            function buildRainLayersForRegion(regionName) {
                const regions = resolveRequestedRegions(regionName, "current");
                return regions.map((region) => createImageryRasterLayer(
                    buildStaticDataUrl(["降雨", region, "降雨量_RGB_当前.tif"]),
                    0.58
                ));
            }

            function showRiskMap(displayMode){
                if (!__viewRef || !__viewRef.map) {

                keepAnnotationLayerOnTop();
                hideLegend();

                syncDisplayState(displayMode);
                updateRegionButtonLabels();
                updateHazardTimestampVisibility();
                const modeText = displayMode === "forecast" ? "明日风险" : "当前风险";
                if (isChinaOnlyNationalHazardRegion(selectedRegion)) {
                    if (shouldAppendForeignCurrentLandslide(selectedRegion, displayMode)) {
                        _toast(`已加载中国${modeText}和国外滑坡当前风险`);
                    } else {
                        _toast(`已加载中国${modeText}`);
                    }
                } else {
                    _toast(selectedRegion === "所有" ? `已加载所有地区${modeText}` : (`已切换${modeText}地区：` + selectedRegion));
                }
                keepAnnotationLayerOnTop();
            {#    keepAnnotationLayerOnTop() 全部替换成：keepAnnotationLayerOnTop()#}
            }

            function hideRiskMap(){
                if (!__viewRef || !__viewRef.map) {
                    buildView([], true, false);
                }
                clearRiskLayers();
                hideLegend();
                isRiskLayerVisible = false;
                currentDisplayMode = "current";
                syncDisplayState("current");
                updateRegionButtonLabels();
                updateHazardTimestampVisibility();
            }

            function toggleRiskLayer(displayMode) {
                if (isRiskLayerVisible && currentDisplayMode === displayMode) {
                    hideRiskMap();
                } else {
                    showRiskMap(displayMode);
                }
            }

            function updateRainRadarButton(active) {
                const rainBtn = document.getElementById("showRainRadar");
                if (!rainBtn) return;
                rainBtn.classList.toggle("is-active", !!active);
            }

            function showRainRadar() {
                if (!__viewRef || !__viewRef.map) {
                    buildView([], true, false);
                }
                clearRiskLayers();
                isRiskLayerVisible = false;
                currentDisplayMode = "current";
                const layers = buildRainLayersForRegion("所有");
                clearRainLayers();
                __rainLayers = layers;
                layers.forEach((layer) => __viewRef.map.add(layer));
                keepAnnotationLayerOnTop();
                hideLegend();
                updateRainRadarButton(true);
                updateHazardTimestampVisibility();
                _toast("已加载所有地区当前降雨量");
            }

            function hideRainRadar() {
                clearRainLayers();
                updateRainRadarButton(false);
            }

            function toggleRainRadar() {
                if (__rainLayers.length) {
                    hideRainRadar();
                } else {
                    showRainRadar();
                }
            }

            let pipelinePollTimer = null;
            let pipelinePanelDismissed = false;
            let pipelinePanelCollapsed = true;
            let isRiskLayerVisible = false;
            let currentDisplayMode = "current";
            let currentPipelineMode = "current";
            let typhoonPanelOpen = false;
            let typhoonListLoaded = false;
            let typhoonList = [];
            let selectedTyphoonId = "";
            let selectedTyphoonMeta = null;
            let typhoonVisibleMode = "";

            function formatHazardTimestamp(meta, displayMode) {
                if (!meta) return "";
                const label = displayMode === "forecast" ? "风险预测时间" : "灾害评估时间";
                let timeText = meta.local_time || meta.datatime || meta.fetched_at || "";
                timeText = String(timeText || "").trim();
                if (!timeText) return "";
                if (timeText.includes("T")) {
                    timeText = timeText.replace("T", " ").replace(/(\+08:00|Z)$/, "");
                    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(timeText)) {
                        timeText = timeText.slice(0, 16);
                    }
                    return `${label}：${timeText}（北京时间）`;
                }
                if (/^\d{10}$/.test(timeText)) {
                    timeText = `${timeText.slice(0, 4)}-${timeText.slice(4, 6)}-${timeText.slice(6, 8)} ${timeText.slice(8, 10)}:00`;
                    return `${label}：${timeText}（北京时间）`;
                }
                return `${label}：${timeText}`;
            }

            function updateHazardTimestampVisibility() {
                const timestampEl = document.getElementById("hazardTimestamp");
                if (!timestampEl) return;
                if (!isRiskLayerVisible) {
                    timestampEl.style.display = "none";
                    timestampEl.textContent = "";
                    return;
                }
                const meta = currentDisplayMode === "forecast"
                    ? (hazardWeatherApiMeta.forecast || {})
                    : (hazardWeatherApiMeta.current || {});
                const text = formatHazardTimestamp(meta, currentDisplayMode);
                if (!text) {
                    timestampEl.style.display = "none";
                    timestampEl.textContent = "";
                    return;
                }
                timestampEl.textContent = text;
                timestampEl.style.display = "block";
            }

            function updateRegionButtonLabels() {}

            function closePipelineStatusPanel() {
                const panel = document.getElementById("runStatusPanel");
                if (!panel) return;
                pipelinePanelDismissed = true;
                panel.classList.add("is-hidden");
            }

            function setPipelinePanelCollapsed(collapsed) {
                const panel = document.getElementById("runStatusPanel");
                const toggle = document.getElementById("runStatusToggle");
                if (!panel || !toggle) return;
                pipelinePanelCollapsed = !!collapsed;
                panel.classList.toggle("is-collapsed", pipelinePanelCollapsed);
                toggle.textContent = pipelinePanelCollapsed ? "▸" : "▾";
                toggle.setAttribute("aria-label", pipelinePanelCollapsed ? "展开" : "收起");
            }


            function togglePipelineStatusPanel() {
                setPipelinePanelCollapsed(!pipelinePanelCollapsed);
            }

            function renderPipelineStatus(data) {
                const panel = document.getElementById("runStatusPanel");
                const runBtn = document.getElementById("runRealtimeRisk");
                const forecastBtn = document.getElementById("runForecastRisk");
                const summary = document.getElementById("runStatusSummary");
                const title = document.querySelector(".run-status-title");
                if (!panel || !runBtn || !forecastBtn || !data) return;

                const statusMap = {
                    idle: "空闲",
                    running: "运行中",
                    completed: "已完成",
                    failed: "失败"
                };
                const statusText = statusMap[data.status] || data.status || "未知";
                const currentScript = data.current_script ? ("\n当前脚本: " + data.current_script) : "";
                const elapsed = Number.isFinite(Number(data.elapsed_seconds))
                    ? ("\n耗时: " + Number(data.elapsed_seconds).toFixed(1) + " 秒")
                    : "";
                const body = document.getElementById("runStatusBody");
                if (!body || !summary) return;

                if ((data.message || "").includes("风险预测")) {
                    currentPipelineMode = "forecast";
                } else if ((data.message || "").includes("风险计算")) {
                    currentPipelineMode = "current";
                }

                if (!pipelinePanelDismissed || data.status === "running") {
                    panel.style.display = "block";
                    panel.classList.remove("is-hidden");
                }

                if (data.status === "completed" || data.status === "failed") {
                    setPipelinePanelCollapsed(false);
                }

                if (title) {
                    title.textContent = currentPipelineMode === "forecast" ? hazardConfig.forecastTitle : hazardConfig.runTitle;
                }

                body.textContent =
                    "状态: " + statusText +
                    currentScript +
                    elapsed +
                    "\n消息: " + (data.message || "");
                summary.textContent = statusText + " · " + Math.floor(Number(data.elapsed_seconds) || 0) + "s";

                if (data.status === "running") {
                    runBtn.disabled = true;
                    forecastBtn.disabled = true;
                    if (currentPipelineMode === "forecast") {
                        forecastBtn.textContent = "预测中";
                    } else {
                        runBtn.textContent = "计算中";
                    }
                } else {
                    runBtn.disabled = false;
                    forecastBtn.disabled = false;
                    runBtn.textContent = "风险计算";
                    forecastBtn.textContent = "风险预测";
                    updateRegionButtonLabels();
                }
            }

            async function pollPipelineStatus() {
                try {
                    const resp = await fetch(hazardConfig.statusUrl);
                    const data = await resp.json();
                    renderPipelineStatus(data);

                    if (data.status === "running") {
                        if (!pipelinePollTimer) {
                            pipelinePollTimer = setInterval(pollPipelineStatus, 2000);
                        }
                    } else if (pipelinePollTimer) {
                        clearInterval(pipelinePollTimer);
                        pipelinePollTimer = null;

                        if (data.status === "completed") {
                            if (isRiskLayerVisible) {
                                showRiskMap(currentDisplayMode);
                            }
                            _toast(data.message || (currentPipelineMode === "forecast" ? `已完成${hazardConfig.forecastTitle}` : `已完成${hazardConfig.runTitle}`));
                        } else if (data.status === "failed") {
                            _toast(data.message || (currentPipelineMode === "forecast" ? `${hazardConfig.forecastTitle}失败` : `${hazardConfig.runTitle}失败`));
                        }
                    }
                } catch (err) {
                    console.error("pollPipelineStatus failed:", err);
                    if (pipelinePollTimer) {
                        clearInterval(pipelinePollTimer);
                        pipelinePollTimer = null;
                    }
                    const runBtn = document.getElementById("runRealtimeRisk");
                    const forecastBtn = document.getElementById("runForecastRisk");
                    if (runBtn) {
                        runBtn.disabled = false;
                        runBtn.textContent = "风险计算";
                    }
                    if (forecastBtn) {
                        forecastBtn.disabled = false;
                        forecastBtn.textContent = "风险预测";
                    }
                    updateRegionButtonLabels();
                    _toast("获取计算状态失败");
                }
            }

            async function runRealtimeRiskCalculation(runMode) {
                const runBtn = document.getElementById("runRealtimeRisk");
                const forecastBtn = document.getElementById("runForecastRisk");
                if (!runBtn || !forecastBtn) return;
                const modeLabel = runMode === "forecast" ? hazardConfig.forecastTitle : hazardConfig.runTitle;

                pipelinePanelDismissed = false;
                setPipelinePanelCollapsed(true);
                currentPipelineMode = runMode;
                runBtn.disabled = true;
                forecastBtn.disabled = true;
                runBtn.textContent = "风险计算";
                forecastBtn.textContent = "风险预测";
                if (runMode === "forecast") {
                    forecastBtn.textContent = "预测中";
                } else {
                    runBtn.textContent = "计算中";
                }
                _toast(`开始执行${modeLabel}...`);

                try {
                    const resp = await fetch(hazardConfig.runUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ trigger: "manual", region: normalizeRegionAlias(selectedRegion), mode: runMode })
                    });

                    const data = await resp.json();
                    if (!resp.ok || !data.ok) {
                        throw new Error(data.error || `${modeLabel}失败`);
                    }

                    renderPipelineStatus(data);
                    if (pipelinePollTimer) {
                        clearInterval(pipelinePollTimer);
                    }
                    pipelinePollTimer = setInterval(pollPipelineStatus, 2000);
                    await pollPipelineStatus();
                } catch (err) {
                    console.error("runRealtimeRiskCalculation failed:", err);
                    _toast(err.message || `${modeLabel}失败`);
                    runBtn.disabled = false;
                    runBtn.textContent = "风险计算";
                    forecastBtn.disabled = false;
                    forecastBtn.textContent = "风险预测";
                    updateRegionButtonLabels();
                }
            }

            const hazardSplitGroups = Array.from(document.querySelectorAll(".hazard-split"));
            const tomorrowGroup = document.getElementById("tomorrowRiskGroup");
            const tomorrowToggleBtn = document.getElementById("tomorrowRiskToggle");
            const riskGroup = document.getElementById("riskGroup");
            const riskToggle = document.getElementById("riskToggle");
            const typhoonToggleBtn = document.getElementById("typhoonToggleBtn");
            const typhoonPanel = document.getElementById("typhoonPanel");
            const typhoonPanelClose = document.getElementById("typhoonPanelClose");
            const typhoonSearchInput = document.getElementById("typhoonSearchInput");
            const typhoonListContainer = document.getElementById("typhoonList");
            const searchParams = new URLSearchParams(window.location.search);
            const initialDisplayMode = searchParams.get("mode") === "forecast" ? "forecast" : "current";
            const shouldAutoShowRisk = searchParams.get("show") === "1";
            const REGIONS = Array.from(new Set(["所有"].concat(
                hazardCurrentRegions || [],
                hazardForecastRegions || []
            )));
            const initialRegionParam = normalizeRegionAlias(searchParams.get("region") || "所有");
            let selectedRegion = initialRegionParam;
            if (selectedRegion !== "所有" && !REGIONS.includes(selectedRegion)) {
                selectedRegion = "所有";
            }


            document.addEventListener("click", function (e) {
                const group = document.getElementById("basemapGroup");
                if (!group.contains(e.target)) {
                    group.classList.remove("open");
                }
            });


            if (hazardSplitGroups.length) {
                hazardSplitGroups.forEach(function (group) {
                    const mainBtn = group.querySelector(".hazard-main-btn");
                    const hazardUrl = group.getAttribute("data-url") || "";
                    const isCurrentHazard = group.getAttribute("data-active") === "true";

                    if (mainBtn) {
                        mainBtn.addEventListener("click", function () {
                            if (isCurrentHazard) {
                                selectedRegion = "所有";
                                showRiskMap("current");
                            } else if (hazardUrl) {
                                window.location.href = `${hazardUrl}?show=1&mode=current&region=${encodeURIComponent("所有")}`;
                            }
                        });
                    }
                });
            }

            if (riskToggle && riskGroup) {
                riskToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    riskGroup.classList.toggle("open");
                    riskToggle.classList.toggle("is-open", riskGroup.classList.contains("open"));
                });
            }

            if (tomorrowToggleBtn && tomorrowGroup) {
                tomorrowToggleBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    tomorrowGroup.classList.toggle("open");
                    tomorrowToggleBtn.classList.toggle("is-open", tomorrowGroup.classList.contains("open"));
                });
            }

            {#if (rainRadarBtn) {#}
            {#    rainRadarBtn.addEventListener("click", function (e) {#}
            {#        e.preventDefault();#}
            {#        e.stopPropagation();#}
            {#        toggleRainRadar();#}
            {#    });#}
            {#}#}

            if (typhoonToggleBtn) {
                typhoonToggleBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleTyphoonPanel();
                });
            }

            if (typhoonPanelClose) {
                typhoonPanelClose.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    closeTyphoonPanel();
                });
            }

            if (typhoonPanel) {
                typhoonPanel.addEventListener("click", function (e) {
                    e.stopPropagation();
                });
            }

            if (typhoonSearchInput) {
                typhoonSearchInput.addEventListener("input", function () {
                    filterTyphoonList();
                });
            }

            if (typhoonListContainer) {
                typhoonListContainer.addEventListener("click", async function (e) {
                    const button = e.target.closest(".typhoon-item");
                    if (!button) return;
                    const stormid = button.getAttribute("data-stormid") || "";
                    const storm = typhoonList.find((item) => item.id === stormid);
                    if (storm) {
                        await selectAndToggleTyphoon(storm);
                    }
                });
            }

            const forecastButtons = Array.from(document.querySelectorAll(".hazard-forecast-btn"));
            forecastButtons.forEach(function (button) {
                button.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (tomorrowGroup) {
                        tomorrowGroup.classList.remove("open");
                    }
                    if (tomorrowToggleBtn) {
                        tomorrowToggleBtn.classList.remove("is-open");
                    }
                    const hazardUrl = button.getAttribute("data-url") || "";
                    const isCurrentHazard = button.getAttribute("data-active") === "true";
                    if (isCurrentHazard) {
                        selectedRegion = "所有";
                        toggleRiskLayer("forecast");
                    } else if (hazardUrl) {
                        window.location.href = `${hazardUrl}?show=1&mode=forecast&region=${encodeURIComponent("所有")}`;
                    }
                });
            });

            document.addEventListener("click", function () {
                if (riskGroup) riskGroup.classList.remove("open");
            });
            document.querySelectorAll("#riskGroup .hazard-main-btn")
            .forEach(function(btn){
                btn.addEventListener("click", function(e){
                    e.preventDefault();
                    e.stopPropagation();

                    const hazardUrl = btn.getAttribute("data-url") || "";
                    const isCurrentHazard = btn.getAttribute("data-active") === "true";

                    // 关闭抽屉
                    riskGroup.classList.remove("open");

                    if (isCurrentHazard) {
                        selectedRegion = "所有";
                        toggleRiskLayer("current");
                    } else if (hazardUrl) {
                        window.location.href = `${hazardUrl}?show=1&mode=current&region=${encodeURIComponent("所有")}`;
                    }
                });
            });

            document.addEventListener("click", function () {
                if (tomorrowGroup) {
                    tomorrowGroup.classList.remove("open");
                }
                if (tomorrowToggleBtn) {
                    tomorrowToggleBtn.classList.remove("is-open");
                }
            });

            buildView([], true, false);
            renderTyphoonInfo(null);
            updateTyphoonButtons();
            syncDisplayState(initialDisplayMode);
            restoreLatestPointState();
            startLatestPointPolling();
            if (shouldAutoShowRisk) {
                showRiskMap(initialDisplayMode);
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            const legendDrawer = document.getElementById("legendDrawer");
            const legendToggle = document.getElementById("legendToggle");
            const legendPanel = document.getElementById("mytuli");

            if (legendDrawer && legendToggle && legendPanel) {
                legendToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    if (legendDrawer.style.display === "none") return;
                    legendPanel.classList.toggle("is-open");
                });

                legendDrawer.addEventListener("click", function (e) {
                    e.stopPropagation();
                });

                document.addEventListener("click", function () {
                    legendPanel.classList.remove("is-open");
                });
            }
        });
    </script>
</head>

<body>
<div id="viewDiv" style=""></div>
<div id="hazardTimestamp"></div>
    <!-- 底图切换按钮 -->
    <div id="basemapEntry">
        <button class="advice-entry-btn" onclick="toggleBasemapDrawer()">
            底图切换
        </button>
    </div>
    <!-- 抽屉内容 -->
    <div id="basemapDrawer">
        <button class="basemap-btn" onclick="switchBasemap('vec')">矢量地图</button>
        <button class="basemap-btn" onclick="switchBasemap('img')">影像地图</button>
        <button class="basemap-btn" onclick="switchBasemap('ter')">地形地图</button>
    </div>

    <div id="adviceEntry">
        <a href="{% url 'advice' %}" class="advice-entry-btn">防灾建议</a>
    </div>

    <div id="legendDrawer">
        <button type="button" id="legendToggle" class="legend-toggle-btn">图例</button>
        <div id="mytuli"><img src="{% static 'images/图例2.png' %}" alt="{{ hazard.legend_alt }}" /></div>
    </div>
<div id="runStatusPanel">
    <div class="run-status-header">
        <div class="run-status-left">
            <button type="button" id="runStatusToggle" class="run-status-toggle" aria-label="展开">▸</button>
            <span class="run-status-title">{{ hazard.run_title }}</span>
            <span id="runStatusSummary" class="run-status-summary"></span>
        </div>
        <button type="button" id="runStatusClose" class="run-status-close" aria-label="关闭">×</button>
    </div>
    <div id="runStatusBody" class="run-status-body"></div>
</div>

<div id="typhoonPanel">
    <div class="typhoon-panel-header">
        <span class="typhoon-panel-title">台风路径</span>
        <button type="button" id="typhoonPanelClose" class="typhoon-panel-close" aria-label="关闭">×</button>
    </div>
    <div class="typhoon-panel-tip">展示最近 5 年台风列表。历史路径优先读本地缓存，实时路径按需请求并保存。</div>
    <input type="text" id="typhoonSearchInput" class="typhoon-search-input" placeholder="搜索台风名称、编号或年份" />
    <div id="typhoonLoading" class="typhoon-loading-text" style="display:none;"></div>
    <div id="typhoonList" class="typhoon-list"></div>
    <div id="typhoonEmpty" class="typhoon-empty-text" style="display:none;">暂无台风列表数据</div>
    <div class="typhoon-info-card">
        <div class="typhoon-info-title">台风信息</div>
        <div id="typhoonInfoBody"></div>
    </div>
</div>

<div id="Choose" style="visibility: visible">
    <ul class="nav">
        <li>
            <div class="hazard-split" id="riskGroup">
                <!-- 抽屉按钮 -->
                <button type="button" id="riskToggle" class="tomorrow-toggle-btn">风险评估</button>

                <!-- 抽屉内容（复用结构） -->
                <div class="hazard-forecast-menu">
                    {% for item in hazard_buttons %}
                    <button
                        type="button"
                        class="hazard-main-btn{% if item.active %} is-active{% endif %}"
                        data-url="{{ item.url }}"
                        data-active="{% if item.active %}true{% else %}false{% endif %}"
                    >
                        {{ item.label }}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </li>
        <li>
            <div class="hazard-split" id="tomorrowRiskGroup">
                <button type="button" id="tomorrowRiskToggle" class="tomorrow-toggle-btn">风险预测</button>
                <div class="hazard-forecast-menu">
                    {% for item in hazard_buttons %}
                    <button
                        type="button"
                        class="hazard-forecast-btn"
                        data-url="{{ item.url }}"
                        data-active="{% if item.active %}true{% else %}false{% endif %}"
                    >{{ item.label }}</button>
                    {% endfor %}
                </div>
           </div>
        </li>
        <li>
            <div class="hazard-split">
                <button type="button" id="typhoonToggleBtn" class="typhoon-toggle-btn">台风路径</button>
            </div>
        </li>
    </ul>
</div>


</body>
</html>
